
name: QueryForge Offline CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: queryforge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    name: Offline tests / Python ${{ matrix.python-version }}

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false

      matrix:
        python-version: ['3.12', '3.13']

    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

      # CI must never connect to the live project database.
      DB_HOST: '127.0.0.1'
      DB_PORT: '1'
      DB_NAME: 'queryforge_dev'
      DB_USER: 'ci_no_database'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install offline test dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Compile Python modules
        run: |
          python -m py_compile \
            sql/practice/day72_real_excel_etl.py \
            sql/practice/day73_persistent_checkpoints.py \
            sql/practice/day74_crash_concurrency.py \
            sql/practice/day75_backup_restore.py \
            sql/practice/day76_monitoring_alerts.py \
            sql/practice/test_day77_ci_workflow.py

      - name: Run offline regression suite
        run: |
          mkdir -p reports

          python -m pytest -q \
            sql/practice/test_day58_error_handling.py \
            sql/practice/test_day59_validation.py \
            sql/practice/test_day61_etl_registry.py \
            sql/practice/test_day62_etl_pipeline.py \
            sql/practice/test_day63_performance_report.py \
            sql/practice/test_day64_etl_reconciliation.py \
            sql/practice/test_day65_etl_monitoring.py \
            sql/practice/test_day66_end_to_end_validation.py \
            sql/practice/test_day67_incremental_upsert.py \
            sql/practice/test_day68_data_quality.py \
            sql/practice/test_day69_batch_recovery.py \
            sql/practice/test_day70_final_project_audit.py \
            sql/practice/test_day72_real_excel_etl.py \
            sql/practice/test_day73_persistent_checkpoints.py \
            sql/practice/test_day74_crash_concurrency.py \
            sql/practice/test_day75_backup_restore.py \
            sql/practice/test_day76_monitoring_alerts.py \
            sql/practice/test_day77_ci_workflow.py \
            --junitxml=reports/pytest-${{ matrix.python-version }}.xml

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queryforge-pytest-${{ matrix.python-version }}
          path: reports/*.xml
          if-no-files-found: warn
          retention-days: 7
